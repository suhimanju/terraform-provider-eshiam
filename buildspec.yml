# AWS CodeBuild build specification for building and testing the provider.
version: 0.2

env:
  variables:
    GOFLAGS: "-mod=mod"
    GOPROXY: "https://proxy.golang.org,direct"

phases:
  install:
    runtime-versions:
      golang: 1.23
    commands:
      - go version

  pre_build:
    commands:
      - go mod download
      - ./pipelines/install_golangci-lint.sh

  build:
    commands:
      - go build -v ./...
      - go vet ./...
      - ./bin/golangci-lint run ./...
      - go install github.com/jstemmer/go-junit-report/v2@latest
      - go test -v -coverprofile=coverage.txt ./... | tee test_output.txt
      - go-junit-report < test_output.txt > report.xml

  post_build:
    commands:
      - go tool cover -func=coverage.txt | tail -n 1

reports:
  unit-tests:
    files:
      - report.xml
    file-format: JUNITXML

artifacts:
  files:
    - coverage.txt
