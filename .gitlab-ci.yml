# GitLab CI/CD pipeline for building, testing, and releasing the provider.
image: golang:1.23

variables:
  GOFLAGS: "-mod=mod"
  GOPROXY: "https://proxy.golang.org,direct"

stages:
  - build
  - test
  - release

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .go-cache/

before_script:
  - export GOPATH="$CI_PROJECT_DIR/.go-cache"
  - export PATH="$GOPATH/bin:$PATH"

build:
  stage: build
  script:
    - go build -v ./...

vet:
  stage: test
  script:
    - go vet ./...

lint:
  stage: test
  script:
    - ./pipelines/install_golangci-lint.sh
    - ./bin/golangci-lint run ./...

unit-test:
  stage: test
  script:
    - go install github.com/jstemmer/go-junit-report/v2@latest
    - go test -v -coverprofile=coverage.txt ./... | tee test_output.txt
    - go-junit-report < test_output.txt > report.xml
    - go tool cover -func=coverage.txt | tail -n 1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - coverage.txt

# Optional: integration tests against a live tenant.
# Define EXAMPLE_HOST, EXAMPLE_CLIENT_ID, and EXAMPLE_CLIENT_SECRET as
# *masked* and *protected* CI/CD variables (Settings > CI/CD > Variables).
# GitLab injects them as environment variables at run time — never commit them.
integration-test:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    TF_ACC: "1"
  script:
    - go test -tags=integration -timeout 120m ./internal/...

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  # GPG_PRIVATE_KEY, GPG_PASSPHRASE, and GITHUB_TOKEN are masked/protected
  # CI/CD variables — GitLab decrypts them into the job environment only.
  script:
    - apt-get update && apt-get install -y gnupg
    - printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
    - export GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
    - curl -sSfL https://goreleaser.com/static/run | bash -s -- release --clean
